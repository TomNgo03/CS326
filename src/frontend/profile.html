<head>

    <title>Profile - Online Shopping</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Online Shopping</h1>
        <nav>

        <h2>Profile</h2>
        <form id="profile-form">

        </form>
        <div id="profile-result"></div>
    </main>
    <script src="script.js"></script>
